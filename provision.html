<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 · 학생 로그인 발급</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6f3;color:#203e36;max-width:640px;margin:40px auto;padding:24px}main{background:white;padding:30px;border-radius:24px}label{display:block;margin:20px 0 6px}input,button{font:inherit;padding:12px;border:1px solid #b5c7bf;border-radius:9px;box-sizing:border-box;width:100%}button{background:#205b48;color:white;margin-top:20px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4ef;padding:16px}small{line-height:1.6}</style>
<main><h1>학생 로그인 발급</h1><p>교사 전용 오프라인 도구입니다. 입력한 비밀번호는 서버로 전송하지 않습니다.</p><p>본인 컴퓨터에서 파일을 열거나 localhost로 실행하세요. 공용 컴퓨터에서는 사용하지 마세요.</p>
<form id="form"><label for="name">고유한 로그인 이름</label><input id="name" maxlength="40" required autocomplete="off" placeholder="예: 가상학생-01"><label for="password">새 비밀번호 (10~128자)</label><input id="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><small>다른 사이트에서 쓰는 비밀번호를 쓰지 마세요. 학생별로 서로 다르게 정하세요.</small><button id="generate">발급 값 만들기</button></form>
<p id="status" role="status"></p><pre id="out" hidden></pre><button id="clear" type="button" hidden>화면에서 발급 값 지우기</button><p>출력된 NEW_PROOF는 비밀번호와 같은 권한을 가진 값입니다. 스크립트 속성에만 임시로 입력하고 GitHub, 메일, 채팅에는 올리지 마세요. app_setup.md의 학생 발급 절차를 따르세요.</p></main>
<script>
const $=id=>document.getElementById(id);const hex=b=>Array.from(new Uint8Array(b),n=>n.toString(16).padStart(2,'0')).join('');
$('form').onsubmit=async e=>{e.preventDefault();$('generate').disabled=true;$('out').hidden=true;try{if(!crypto.subtle)throw Error('Web Crypto를 사용할 수 없어요. localhost 또는 최신 브라우저에서 열어 주세요.');const n=$('name').value.normalize('NFKC').trim();if(!n||/[\x00-\x1f\x7f]/.test(n))throw Error('이름을 확인하세요.');const salt=crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode($('password').value),'PBKDF2',false,['deriveBits']);$('password').value='';const proof=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},key,256);$('out').textContent='NEW_NAME = '+n+'\nNEW_SALT = '+hex(salt)+'\nNEW_PROOF = '+hex(proof);$('out').hidden=false;$('clear').hidden=false;$('status').textContent='스크립트 속성에 옮긴 다음 이 화면의 값을 지우세요.';}catch(err){$('status').textContent=err.message;}finally{$('password').value='';$('generate').disabled=false;}};
$('clear').onclick=()=>{$('out').textContent='';$('out').hidden=true;$('clear').hidden=true;$('form').reset();$('status').textContent='지웠어요. 클립보드에 복사했다면 클립보드도 지워 주세요.';};
</script></html>
